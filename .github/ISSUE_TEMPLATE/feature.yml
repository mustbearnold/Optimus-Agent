name: Feature or enhancement
description: Propose a product or architecture capability.
title: "feat: "
labels:
  - "✨ type:feat"
  - "🔍 status:triage"
body:
  - type: markdown
    attributes:
      value: |
        Define one independently valuable outcome. Never paste credentials or private information.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What single outcome must exist when this issue is complete?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Who is blocked, what current behaviour exists, and what evidence or prior decision applies?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Confirmed vs Planned — do not claim implementation that does not exist.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Architectural, safety, compatibility, UX, performance, or scope boundaries.
      placeholder: "- Preserve …\n- Do not …"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - "🧠 area:kernel"
        - "🔁 area:runtime"
        - "🤖 area:agent"
        - "🔀 area:workflow"
        - "🖥️ area:desktop"
        - "🎨 area:ui"
        - "💻 area:cli"
        - "🛡️ area:security"
        - "📊 area:eval"
        - "🌐 area:browser"
        - "📖 area:docs"
        - "other"
    validations:
      required: true
  - type: checkboxes
    id: program
    attributes:
      label: Program linkage
      options:
        - label: S+++ architecture program (🏆 program:s+++)
        - label: Hermes parity / version gate (⚖️ program:parity)
        - label: Requires ADR (📋 process:adr)
  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: Testable bullets covering source, tests, docs/ADR, Engineering Memory, and affected gates.
      placeholder: "- [ ] …\n- [ ] just verify passes"
    validations:
      required: true
