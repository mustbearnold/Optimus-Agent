name: Feature or enhancement
description: Propose a product or architecture capability.
title: "feat: "
labels:
  - type:feat
  - status:triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / opportunity
      description: Who is blocked and what outcome do they need?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Confirmed vs Planned — do not claim implementation that does not exist.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - area:kernel
        - area:runtime
        - area:agent
        - area:workflow
        - area:desktop
        - area:ui
        - area:cli
        - area:security
        - area:eval
        - area:browser
        - area:docs
        - area:other
    validations:
      required: true
  - type: checkboxes
    id: program
    attributes:
      label: Program linkage
      options:
        - label: S+++ architecture program (program:s+++)
        - label: Hermes parity / version gate (program:parity)
        - label: Requires ADR (process:adr)
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable bullets (source + tests).
    validations:
      required: true
