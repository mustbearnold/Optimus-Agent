name: Bug report
description: Something is broken or incorrect in Optimus Agent.
title: "bug: "
labels:
  - "🐛 type:bug"
  - "🔍 status:triage"
body:
  - type: markdown
    attributes:
      value: |
        Use **Confirmed current behaviour** language. Prefer executable evidence over prose claims.
        Every implementation issue needs Goal, Context, Constraints, and testable Done when conditions. Never paste credentials or private information.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The single restored outcome this issue must deliver.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Who is affected, where it occurs, and the evidence already known.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Exact commands, UI path, or test that fails.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Safety, compatibility, scope, performance, or migration boundaries that must remain true.
      placeholder: "- Preserve …\n- Do not …"
    validations:
      required: true
  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: Testable completion conditions, including the regression proof and affected verification gates.
      placeholder: "- [ ] …\n- [ ] just verify passes"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      multiple: false
      options:
        - "🧠 area:kernel"
        - "🔁 area:runtime"
        - "🤖 area:agent"
        - "🔀 area:workflow"
        - "🖥️ area:desktop"
        - "🎨 area:ui"
        - "💻 area:cli"
        - "🛡️ area:security"
        - "📊 area:eval"
        - "🌐 area:browser"
        - "🧩 area:memory"
        - "other"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority guess
      options:
        - "⬇️ priority:p3"
        - "⚠️ priority:p2"
        - "🔥 priority:p1"
        - "🚨 priority:p0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, install path, Optimus version/commit if known.
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This may be a security-sensitive issue (add 🔐 risk:security after triage)
