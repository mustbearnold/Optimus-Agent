# Canonical GitHub labels for Optimus Agent.
# Sync with: python3 scripts/sync-github-labels.py
#
# Convention: single leading emoji + space + namespace:value
#   Example: "✨ type:feat"
#
# Namespaces:
#   type:     what kind of change
#   area:     owning subsystem
#   priority: urgency
#   status:   workflow state
#   size:     PR review bulk
#   risk:     blast radius
#   program:  long-running initiatives
#   process:  meta / workflow hygiene

labels:
  # --- type ---
  - name: "🐛 type:bug"
    color: "d73a4a"
    description: "Defect: incorrect or broken behaviour"
  - name: "✨ type:feat"
    color: "0e8a16"
    description: "New user-visible feature or capability"
  - name: "🔧 type:fix"
    color: "1d76db"
    description: "Bug fix for incorrect behaviour"
  - name: "♻️ type:refactor"
    color: "fbca04"
    description: "Code change that neither fixes a bug nor adds a feature"
  - name: "📝 type:docs"
    color: "0075ca"
    description: "Documentation only"
  - name: "✅ type:test"
    color: "bfd4f2"
    description: "Tests only (no production behaviour change)"
  - name: "🧹 type:chore"
    color: "cfd3d7"
    description: "Maintenance, tooling, deps, housekeeping"
  - name: "⚙️ type:ci"
    color: "e4e669"
    description: "CI/CD workflows and automation"
  - name: "⚡ type:perf"
    color: "5319e7"
    description: "Performance improvement"
  - name: "🔒 type:security"
    color: "b60205"
    description: "Security fix or hardening"
  - name: "🏗️ type:architecture"
    color: "d93f0b"
    description: "Architecture, ADR, or structural program work"

  # --- area ---
  - name: "🧠 area:kernel"
    color: "1d76db"
    description: "optimus-kernel turn loop / providers"
  - name: "🔁 area:runtime"
    color: "0052cc"
    description: "optimus-runtime / Work Graph / SmartDeny"
  - name: "🤖 area:agent"
    color: "5319e7"
    description: "optimus-agent specialists and invocations"
  - name: "🔀 area:workflow"
    color: "6f42c1"
    description: "optimus-workflow DAG runs and verticals"
  - name: "📦 area:artifacts"
    color: "bfdadc"
    description: "optimus-artifacts store"
  - name: "🧩 area:memory"
    color: "c5def5"
    description: "optimus-memory MetaMemory"
  - name: "🎯 area:skills"
    color: "bfe5bf"
    description: "optimus-skills"
  - name: "📚 area:packs"
    color: "d4c5f9"
    description: "optimus-packs tool catalog"
  - name: "💾 area:store"
    color: "f9d0c4"
    description: "optimus-store / graph persistence"
  - name: "🛰️ area:ops"
    color: "fef2c0"
    description: "optimus-ops gateway and cron"
  - name: "📊 area:eval"
    color: "fad8c7"
    description: "optimus-eval offline integrity and reports"
  - name: "💻 area:cli"
    color: "0e8a16"
    description: "apps/optimus-cli"
  - name: "🖥️ area:desktop"
    color: "006b75"
    description: "desktop host / Electron / React shell"
  - name: "🎨 area:ui"
    color: "1d76db"
    description: "optimus-ui React workbench"
  - name: "🌐 area:browser"
    color: "e99695"
    description: "browser effector / CDP / preview"
  - name: "🛡️ area:security"
    color: "b60205"
    description: "approvals, sandbox, SmartDeny, secrets"
  - name: "📖 area:docs"
    color: "0075ca"
    description: "docs/, ADRs, maps, plans"
  - name: "🧬 area:em"
    color: "5319e7"
    description: "Engineering Memory scripts and generated indexes"
  - name: "🏭 area:ci"
    color: "e4e669"
    description: "CI, install scripts, gates"

  # --- priority ---
  - name: "🚨 priority:p0"
    color: "b60205"
    description: "Drop everything - production break or security"
  - name: "🔥 priority:p1"
    color: "d93f0b"
    description: "Next milestone blocker"
  - name: "⚠️ priority:p2"
    color: "fbca04"
    description: "Important but not blocking current milestone"
  - name: "⬇️ priority:p3"
    color: "0e8a16"
    description: "Nice-to-have / backlog"

  # --- status ---
  - name: "🔍 status:triage"
    color: "d4c5f9"
    description: "Needs triage / categorization"
  - name: "🟢 status:ready"
    color: "0e8a16"
    description: "Ready for implementation"
  - name: "🚧 status:in-progress"
    color: "fbca04"
    description: "Actively being worked"
  - name: "⛔ status:blocked"
    color: "b60205"
    description: "Blocked on dependency or decision"
  - name: "👀 status:needs-review"
    color: "1d76db"
    description: "Awaiting code or design review"
  - name: "✏️ status:changes-requested"
    color: "d93f0b"
    description: "Review requested changes"
  - name: "✔️ status:approved"
    color: "0e8a16"
    description: "Review approved; ready to merge"
  - name: "🚫 status:do-not-merge"
    color: "b60205"
    description: "Must not merge yet"

  # --- size ---
  - name: "▫️ size:XS"
    color: "cfd3d7"
    description: "Trivial: ~1 file or under 50 LOC"
  - name: "▪️ size:S"
    color: "c2e0c6"
    description: "Small: focused, easy to review"
  - name: "◾ size:M"
    color: "fef2c0"
    description: "Medium: multi-file, still one concern"
  - name: "⬛ size:L"
    color: "fad8c7"
    description: "Large: multi-subsystem; consider splitting"
  - name: "🟪 size:XL"
    color: "e99695"
    description: "Extra large: prefer stack of smaller PRs"

  # --- risk ---
  - name: "💥 risk:breaking"
    color: "b60205"
    description: "May break API, schema, or installed users"
  - name: "🔐 risk:security"
    color: "b60205"
    description: "Security-sensitive; extra review required"
  - name: "📀 risk:data"
    color: "d93f0b"
    description: "Touches durable stores / migrations"
  - name: "🍃 risk:low"
    color: "c2e0c6"
    description: "Low blast radius"

  # --- program ---
  - name: "🏆 program:s+++"
    color: "5319e7"
    description: "S+++ architecture quality program"
  - name: "⚖️ program:parity"
    color: "0052cc"
    description: "Hermes parity / version gate work"

  # --- process ---
  - name: "📋 process:adr"
    color: "d4c5f9"
    description: "Requires or includes an ADR"
  - name: "🔄 process:em-refresh"
    color: "5319e7"
    description: "Requires Engineering Memory generate/validate"
  - name: "🌱 process:good-first-issue"
    color: "7057ff"
    description: "Good for newcomers"
  - name: "🙋 process:help-wanted"
    color: "008672"
    description: "Extra attention appreciated"
  - name: "👯 process:duplicate"
    color: "cfd3d7"
    description: "Duplicate of another issue/PR"
  - name: "🙅 process:wontfix"
    color: "eeeeee"
    description: "Will not be worked on"
  - name: "❌ process:invalid"
    color: "e4e669"
    description: "Invalid or not actionable"
  - name: "❓ process:question"
    color: "d876e3"
    description: "Question / discussion"

  # Wayfinder — map + ticket types for the mattpocock-skills wayfinder skill.
  # A map is one issue; its tickets are child issues, each carrying one type.
  - name: "🗺️ wayfinder:map"
    color: "0e8a16"
    description: "A wayfinder map — the effort's canonical route"
  - name: "🔍 wayfinder:research"
    color: "1d76db"
    description: "Wayfinder ticket: surface a fact a decision waits on (AFK)"
  - name: "🧪 wayfinder:prototype"
    color: "5319e7"
    description: "Wayfinder ticket: build something cheap to react to (HITL)"
  - name: "🔥 wayfinder:grilling"
    color: "d93f0b"
    description: "Wayfinder ticket: resolve by conversation, one question at a time (HITL)"
  - name: "🔧 wayfinder:task"
    color: "fbca04"
    description: "Wayfinder ticket: manual work that unblocks a decision"
