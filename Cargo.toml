[workspace]
resolver = "2"
members = [
    "crates/optimus-store",
    "crates/optimus-graph",
    "crates/optimus-policy",
    "crates/optimus-host",
    "crates/optimus-runtime",
    "crates/optimus-memory",
    "crates/optimus-skills",
    "crates/optimus-packs",
    "crates/optimus-ops",
    "crates/optimus-artifacts",
    "crates/optimus-agent",
    "crates/optimus-workflow",
    "crates/optimus-kernel",
    "crates/optimus-eval",
    "crates/optimus-browser",
    "apps/optimus-cli",
    "apps/optimus-tui",
    "apps/optimus-desktop",
    "apps/optimus-tauri",
]
default-members = [
    "crates/optimus-store",
    "crates/optimus-graph",
    "crates/optimus-policy",
    "crates/optimus-host",
    "crates/optimus-runtime",
    "crates/optimus-memory",
    "crates/optimus-skills",
    "crates/optimus-packs",
    "crates/optimus-ops",
    "crates/optimus-artifacts",
    "crates/optimus-agent",
    "crates/optimus-workflow",
    "crates/optimus-kernel",
    "crates/optimus-eval",
    "apps/optimus-cli",
    "apps/optimus-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
authors = ["Optimus Agent"]
repository = "https://github.com/local/optimus-agent"

[workspace.dependencies]
optimus-store = { path = "crates/optimus-store" }
optimus-graph = { path = "crates/optimus-graph" }
optimus-policy = { path = "crates/optimus-policy" }
optimus-host = { path = "crates/optimus-host" }
optimus-tui = { path = "apps/optimus-tui" }
optimus-runtime = { path = "crates/optimus-runtime" }
optimus-memory = { path = "crates/optimus-memory" }
optimus-skills = { path = "crates/optimus-skills" }
optimus-packs = { path = "crates/optimus-packs" }
optimus-ops = { path = "crates/optimus-ops" }
optimus-artifacts = { path = "crates/optimus-artifacts" }
optimus-agent = { path = "crates/optimus-agent" }
optimus-workflow = { path = "crates/optimus-workflow" }
optimus-kernel = { path = "crates/optimus-kernel" }
optimus-eval = { path = "crates/optimus-eval" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ripgrep's own engine and walker, linked rather than shelled out to: no
# dependency on an `rg` binary being installed, and a workspace read stays a
# WorkspaceRead tool instead of escalating to a Process-policy approval.
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
globset = "0.4"
sha2 = "0.10"
thiserror = "2"
# `v5` is not a second id scheme: it is how a gateway routing address resolves
# to the one session that address has always meant, without a table that could
# disagree with the ledger (ADR-0071).
uuid = { version = "1", features = ["v4", "v5", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
# Terminal-level test tooling. A pty plus a vt100 parser is what lets a test
# read the screen a human would see — including the cursor, which no
# `TestBackend` assertion can reach because the cursor lives in the terminal,
# not in the buffer. Dev-only; nothing ships with these.
portable-pty = "0.9"
vt100 = "0.15"
proptest = "1"
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
cap-std = "4.0.2"
fs2 = "0.4.3"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
