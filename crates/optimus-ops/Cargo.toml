[package]
name = "optimus-ops"
description = "Operator services: local gateway delivery authority and cron schedule store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# spec-017 transports: websocket (Discord gateway, Slack Socket Mode), IMAP
# inbound, SMTP outbound. One TLS configuration: rustls everywhere — IMAP via
# the `imap` crate's generic client over a rustls socket (adapters/email.rs),
# never its native-tls feature. rustls-pemfile parses the CA bundle;
# mailparse extracts MIME parts for the artifact store (A7).
imap = { version = "2", default-features = false }
lettre = { version = "0.11", default-features = false, features = ["rustls-tls", "smtp-transport", "builder"] }
mailparse = "0.15"
optimus-artifacts.workspace = true
optimus-packs.workspace = true
rusqlite.workspace = true
rustls-pemfile = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tungstenite = { version = "0.26", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
# Matches the pin `optimus-kernel` already carries. First-party HTTP stays on
# one client API and one TLS configuration; see
# `docs/evidence/telegram-transport-practice-2026-08-01.md`.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# A loopback Bot API stands in for Telegram so the request this transport
# actually builds is asserted against a real socket rather than a mock of it.
tiny_http.workspace = true
uuid.workspace = true
