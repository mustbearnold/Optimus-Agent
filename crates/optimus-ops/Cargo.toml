[package]
name = "optimus-ops"
description = "Operator services: local gateway delivery authority and cron schedule store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# spec-017 transports: websocket (Discord gateway, Slack Socket Mode), IMAP
# inbound, SMTP outbound. HTTP + websockets ride rustls (ureq/tungstenite);
# IMAP is a documented exception — the `imap` crate's only TLS feature is
# native-tls, and a hand-rolled IMAP client over rustls would trade an
# audited protocol implementation for a smaller TLS surface. Revisit if the
# `imap` crate gains rustls support.
imap = { version = "2", default-features = false, features = ["tls"] }
lettre = { version = "0.11", default-features = false, features = ["rustls-tls", "smtp-transport", "builder"] }
optimus-packs.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tungstenite = { version = "0.26", default-features = false, features = ["rustls-tls-webpki-roots"] }
# Matches the pin `optimus-kernel` already carries. First-party HTTP stays on
# one client API and one TLS configuration; see
# `docs/evidence/telegram-transport-practice-2026-08-01.md`.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# A loopback Bot API stands in for Telegram so the request this transport
# actually builds is asserted against a real socket rather than a mock of it.
tiny_http.workspace = true
uuid.workspace = true
