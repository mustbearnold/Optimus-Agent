[package]
name = "optimus-kernel"
description = "Provider-agnostic agent turn loop assembling packs, memory, skills, jobs (ops re-exported; offline eval is optimus-eval)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
optimus-graph.workspace = true
optimus-runtime.workspace = true
optimus-memory.workspace = true
optimus-skills.workspace = true
optimus-packs.workspace = true
optimus-ops.workspace = true
optimus-artifacts.workspace = true
optimus-agent.workspace = true
optimus-workflow.workspace = true
optimus-browser = { path = "../../crates/optimus-browser", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
rusqlite.workspace = true
sha2.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
globset.workspace = true
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
url = "2"
which = "7"
base64 = "0.22"
fs2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
aes-gcm = "0.10"
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["cdp"]
cdp = ["optimus-browser"]
