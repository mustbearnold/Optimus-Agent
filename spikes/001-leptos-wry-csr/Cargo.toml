[package]
name = "optimus-leptos-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
js-sys = "0.3"
leptos = { version = "=0.8.20", features = ["csr"] }
serde = "1"
serde-wasm-bindgen = "0.6"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlElement", "Window"] }

# Keep this disposable experiment outside the production Cargo workspace.
[workspace]
