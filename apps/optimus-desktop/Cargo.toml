[package]
name = "optimus-desktop"
description = "Optimus Agent conversation-first desktop shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "optimus-desktop"
path = "src/main.rs"

[dependencies]
optimus-host.workspace = true
optimus-kernel.workspace = true
optimus-packs.workspace = true
optimus-runtime.workspace = true
optimus-graph.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
clap.workspace = true
tao = "0.34"
wry = "0.55"
dirs = "6"
tiny_http = "0.12"
rfd = "0.15"
url = "2"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
gtk = "0.18"

[dev-dependencies]
tempfile.workspace = true
