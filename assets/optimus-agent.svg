<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Optimus Agent</title>
  <desc id="desc">A luminous segmented O surrounding an agent spark on a dark rounded square.</desc>
  <defs>
    <linearGradient id="surface" x1="24" y1="20" x2="230" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171A24"/>
      <stop offset="1" stop-color="#07080D"/>
    </linearGradient>
    <linearGradient id="ring" x1="53" y1="42" x2="207" y2="211" gradientUnits="userSpaceOnUse">
      <stop stop-color="#57E6FF"/>
      <stop offset="0.48" stop-color="#7287FF"/>
      <stop offset="1" stop-color="#B067FF"/>
    </linearGradient>
    <radialGradient id="spark" cx="0" cy="0" r="1" gradientTransform="translate(128 128) rotate(90) scale(43)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.34" stop-color="#9BEAFF"/>
      <stop offset="1" stop-color="#6879FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="25" y="25" width="206" height="206" filterUnits="userSpaceOnUse">
