    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#surface)"/>
  <rect x="9" y="9" width="238" height="238" rx="53" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="128" cy="128" r="72" fill="none" stroke="url(#ring)" stroke-opacity="0.28" stroke-width="20" filter="url(#glow)"/>
  <path d="M188.8 166.5A72 72 0 1 1 188.8 89.5" fill="none" stroke="url(#ring)" stroke-width="19" stroke-linecap="round"/>
  <path d="M199 102L207 128L199 154" fill="none" stroke="#8DA1FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="128" cy="128" r="43" fill="url(#spark)" opacity="0.82"/>
  <path d="M128 91L136.2 119.8L165 128L136.2 136.2L128 165L119.8 136.2L91 128L119.8 119.8L128 91Z" fill="#F4FCFF"/>
  <circle cx="128" cy="128" r="7" fill="#5FDFFF"/>
